[package]
name = "monkmode"
version = "0.1.0"
description = "Monk Mode AI tray app"
authors = ["Monk Mode"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

